version: 1.0
name: kg-organization-node
desc: Organization node represents the kg organization within the network
modules:
  - name: discovery
    config:
      # Any node already in the network; no node is special.
      bootstrap:
        - ${DISCOVERY_BOOTSTRAP}
  - name: relay
    config:
      # Relays to stay reachable through if this node accepts no connections.
      via:
        - ${RELAY_VIA}
  # Lets tools such as the network explorer (web/) inspect this node.
  - name: debug
