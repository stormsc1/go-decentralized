version: 1.0
name: ks-organization-node
desc: Organization node represents the ks organization within the network
network:
  relay:
    # Relays to stay reachable through if this node accepts no connections.
    via:
      - ${RELAY_VIA}
modules:
  - name: discovery
    config:
      # Any node already in the network; no node is special.
      bootstrap:
        - ${DISCOVERY_BOOTSTRAP}
  # Lets tools such as the network explorer (web/) inspect this node.
  - name: debug
