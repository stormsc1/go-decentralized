version: 1.0
name: ${ORG}-organization-node
desc: Organization node representing the ${ORG} organization within the network
network:
  # Any node already in the network, to join through; no node is special.
  bootstrap:
    - ${BOOTSTRAP}
  relay:
    # Relays to stay reachable through if this node accepts no connections.
    via:
      - ${RELAY_VIA}
modules:
  # Lets tools such as the network explorer (web/) inspect this node.
  - name: debug
  # An example module: compiled into the node, or in a process of its own if
  # GREETER_RUN names the command.
  - name: greeter
    run: [${GREETER_RUN}]
