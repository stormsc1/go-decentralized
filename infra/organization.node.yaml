version: 1.0
name: ${ORG}-organization-node
desc: Organization node representing the ${ORG} organization within the network
network:
  # Any node already in the network, to join through; no node is special.
  bootstrap:
    - ${BOOTSTRAP}
  relay:
    # Relays to stay reachable through if this node accepts no connections.
    via:
      - ${RELAY_VIA}
# Stores for modules' data, by name. A module's block binds every store its
# manifest declares to one of them.
stores:
  main: {driver: sqlite} # <node name>.main.db in the data directory
modules:
  # Lets tools such as the network explorer (web/) inspect this node.
  - name: debug
  # The chat, for the chat web app (web/chat.html).
  - name: chat
    stores: {data: main}
  # Keeps people's root identities, wrapped so it can't read them, for those
  # without a vault of their own.
  - name: vault
    stores: {data: main}
  # An example module: compiled into the node, or in a process of its own if
  # GREETER_RUN names the command.
  - name: greeter
    run: [${GREETER_RUN}]
