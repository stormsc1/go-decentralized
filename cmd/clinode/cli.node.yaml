version: 1.0
name: cli-node
desc: Interactive terminal for triggering capabilities on the network
network:
  # Any node already in the network, to join through; no node is special.
  bootstrap:
    - ${BOOTSTRAP}
stores:
  main: {path: ":memory:"} # the CLI keeps nothing between runs
modules:
  # Diagnostics: map_network, ping_node.
  - name: debug
  # Try: chat.register id=me name=Me
  - name: chat
    stores: {data: main}
  # Try: greeter.greet id=<a node running greeter>
  - name: greeter
