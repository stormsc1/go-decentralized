# yaml-language-server: $schema=../../spec/module.schema.json
name: store
version: 1.0.0
description: Keeps the calling module's records and key-value pairs on this node. Built into nodes, for modules. See spec/modules.md, "Storage".
capabilities:
  - name: put
    description: Stores a record of one of the module's entity types, replacing any with the same ID.
    internal: true
    input:
      type: object
      required: [entity, id, record]
      properties:
        entity: {type: string}
        id: {$ref: "#/$defs/id"}
        record: {type: object, description: "Checked against the entity type's schema."}
        if_version: {$ref: "#/$defs/if_version"}
    output: {$ref: "#/$defs/version"}
  - name: get
    description: Returns a record by ID, with its version.
    internal: true
    input: {$ref: "#/$defs/record_ref"}
    output: {$ref: "#/$defs/record"}
  - name: delete
    description: Deletes a record by ID, if there is one.
    internal: true
    input:
      type: object
      required: [entity, id]
      properties:
        entity: {type: string}
        id: {$ref: "#/$defs/id"}
        if_version: {$ref: "#/$defs/if_version"}
  - name: query
    description: Returns the records that match, by their indexed fields.
    internal: true
    input:
      type: object
      required: [entity]
      properties:
        entity: {type: string}
        where:
          type: object
          description: 'Indexed fields, or id, and the value each must have, or conditions: {"gt": v}, {"gte": v}, {"lt": v}, {"lte": v}.'
        order_by: {type: string, description: An indexed field, or id, the default. Ties sort by id.}
        desc: {type: boolean}
        limit: {type: integer, minimum: 1, maximum: 1000, description: Defaults to 100.}
    output:
      type: object
      properties:
        records: {type: array, items: {$ref: "#/$defs/record"}}
  - name: batch
    description: Writes records in order, all or none.
    internal: true
    input:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [op, entity, id]
            properties:
              op: {enum: [put, delete]}
              entity: {type: string}
              id: {$ref: "#/$defs/id"}
              record: {type: object, description: For put.}
              if_version: {$ref: "#/$defs/if_version"}
    output: {$ref: "#/$defs/versions"}
  - name: kv_get
    description: Returns the value of a key, with its version.
    internal: true
    input:
      type: object
      required: [key]
      properties:
        key: {$ref: "#/$defs/key"}
    output: {$ref: "#/$defs/pair"}
  - name: kv_put
    description: Sets the value of a key.
    internal: true
    input:
      type: object
      required: [key, value]
      properties:
        key: {$ref: "#/$defs/key"}
        value: {description: Any JSON value.}
        if_version: {$ref: "#/$defs/if_version"}
    output: {$ref: "#/$defs/version"}
  - name: kv_delete
    description: Deletes a key, if it's there.
    internal: true
    input:
      type: object
      required: [key]
      properties:
        key: {$ref: "#/$defs/key"}
        if_version: {$ref: "#/$defs/if_version"}
  - name: kv_list
    description: Lists the keys starting with prefix, and their values, by key.
    internal: true
    input:
      type: object
      properties:
        prefix: {type: string}
        limit: {type: integer, minimum: 1, maximum: 1000, description: Defaults to 100.}
    output:
      type: object
      properties:
        pairs: {type: array, items: {$ref: "#/$defs/pair"}}
  - name: kv_batch
    description: Writes pairs in order, all or none.
    internal: true
    input:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [op, key]
            properties:
              op: {enum: [put, delete]}
              key: {$ref: "#/$defs/key"}
              value: {description: For put, any JSON value.}
              if_version: {$ref: "#/$defs/if_version"}
    output: {$ref: "#/$defs/versions"}
  - name: blob_put
    description: Writes a blob under a key, replacing what was there. One call carries up to 512 KiB.
    internal: true
    input:
      type: object
      required: [key, data]
      properties:
        key: {$ref: "#/$defs/key"}
        content_type: {type: string}
        data: {type: string, contentEncoding: base64}
  - name: blob_get
    description: Returns a blob and its bytes.
    internal: true
    input:
      type: object
      required: [key]
      properties:
        key: {$ref: "#/$defs/key"}
    output:
      type: object
      allOf: [{$ref: "#/$defs/blob"}]
      properties:
        data: {type: string, contentEncoding: base64}
  - name: blob_stat
    description: Describes a blob without reading it.
    internal: true
    input:
      type: object
      required: [key]
      properties:
        key: {$ref: "#/$defs/key"}
    output: {$ref: "#/$defs/blob"}
  - name: blob_delete
    description: Deletes a blob, if it's there.
    internal: true
    input:
      type: object
      required: [key]
      properties:
        key: {$ref: "#/$defs/key"}
  - name: blob_list
    description: Describes the blobs whose key starts with prefix, by key.
    internal: true
    input:
      type: object
      properties:
        prefix: {type: string}
        limit: {type: integer, minimum: 1, maximum: 1000, description: Defaults to 100.}
    output:
      type: object
      properties:
        blobs: {type: array, items: {$ref: "#/$defs/blob"}}
$defs:
  id: {type: string, minLength: 1, maxLength: 256}
  key: {type: string, minLength: 1, maxLength: 512}
  blob:
    type: object
    properties:
      key: {type: string}
      size: {type: integer}
      content_type: {type: string}
      modified: {type: string, format: date-time}
  if_version:
    type: integer
    minimum: 0
    description: "The version the record or pair must have for the write to happen, 0 for none yet; else the call fails with store.conflict. Unset means any."
  version:
    type: object
    properties:
      version: {type: integer, description: "The record's or pair's new version, counting its writes from 1."}
  versions:
    type: object
    properties:
      versions: {type: array, items: {type: integer}, description: The new version of each put, 0 for deletes.}
  record_ref:
    type: object
    required: [entity, id]
    properties:
      entity: {type: string}
      id: {$ref: "#/$defs/id"}
  record:
    type: object
    properties:
      id: {type: string}
      version: {type: integer}
      record: {type: object}
  pair:
    type: object
    properties:
      key: {type: string}
      version: {type: integer}
      value: {description: Any JSON value.}
